# JLCPCB rotation corrections for pick-and-place files.
#
# KiCad and JLCPCB use different 0-degree orientation conventions for
# many common footprints.  These corrections are added to the KiCad
# rotation value to produce the JLCPCB-expected orientation.
#
# Patterns use fnmatch-style glob matching:
#   SOT-23*  matches  SOT-23, SOT-23-3, SOT-23-5, SOT-23-6, etc.
#
# Sign convention: degrees added to KiCad's rotation, CCW-positive, so a
# 90-degree *clockwise* correction is written 270.0 (== -90).
#
# Entry forms (both sections):
#   "Pattern*": 180.0                       # rotation only (legacy form)
#   "Pattern*": {rotation: 180.0, offset_x_mm: 0.0, offset_y_mm: -1.2}
#
# Offsets are in the FOOTPRINT-LOCAL frame, i.e. the library footprint as
# drawn in KiCad's footprint editor (same axes as pad (at ...) coordinates):
# +X right, +Y DOWN, top-side view.  The offset is the vector from KiCad's
# footprint origin to the assembler's part origin.  At export it is rotated
# by the part's placement angle exactly like a pad offset, with local Y
# negated for B.Cu parts (KiCad mirrors pad Y when flipping), and added to
# Mid X / Mid Y.  One entry therefore stays correct at any rotation/side.
#
# ``lcsc_corrections`` keys are LCSC part numbers, read from the footprint's
# LCSC property (same property names as the BOM: LCSC, LCSC_PN, JLC, ...).
# An LCSC entry takes precedence over the footprint globs; if it omits
# ``rotation`` the matching glob's rotation is inherited.
#
# Sources:
#   - KiBot rotation correction database
#   - JLCPCB SMT assembly documentation
#   - Community-validated corrections

rotation_corrections:
  # --- SOT packages ---
  "SOT-23*": 180.0
  "SOT-323*": 180.0
  "SOT-363*": 180.0
  "SOT-89*": 180.0
  "SOT-223*": 180.0
  "SOT-353*": 180.0
  "SOT-523*": 180.0
  "SOT-666*": 180.0

  # --- SOP / SOIC packages ---
  "SOIC-8*": 270.0
  "SOP-8*": 270.0
  "SOIC-14*": 270.0
  "SOIC-16*": 270.0
  "SOIC-18*": 270.0
  "SOIC-20*": 270.0
  "SOP-4*": 270.0
  "SOP-16*": 270.0

  # --- SSOP / TSSOP packages ---
  "SSOP-8*": 270.0
  "SSOP-14*": 270.0
  "SSOP-16*": 270.0
  "SSOP-20*": 270.0
  "SSOP-24*": 270.0
  "SSOP-28*": 270.0
  "TSSOP-8*": 270.0
  "TSSOP-14*": 270.0
  "TSSOP-16*": 270.0
  "TSSOP-20*": 270.0
  "TSSOP-24*": 270.0
  "TSSOP-28*": 270.0

  # --- QFN packages ---
  "QFN-*": 270.0
  "DFN-*": 270.0
  "VQFN-*": 270.0
  "UQFN-*": 270.0
  "WQFN-*": 270.0

  # --- QFP packages ---
  "LQFP-*": 270.0
  "TQFP-*": 270.0
  "QFP-*": 270.0

  # --- Diode packages ---
  "D_SOD-123*": 180.0
  "D_SOD-323*": 180.0
  "D_SOD-523*": 180.0
  "D_SOD-723*": 180.0
  "D_SOD-923*": 180.0
  "D_SMB*": 180.0
  "D_SMA*": 180.0

  # --- LED packages ---
  "LED_0402*": 180.0
  "LED_0603*": 180.0
  "LED_0805*": 180.0
  "LED_1206*": 180.0

  # --- Power packages ---
  "TO-252*": 180.0
  "DPAK*": 180.0
  "TO-263*": 180.0
  "D2PAK*": 180.0
  "TO-268*": 180.0
  "SOT-669*": 180.0

  # --- Crystal / oscillator packages ---
  "Crystal_SMD_2016*": 180.0
  "Crystal_SMD_2520*": 180.0
  "Crystal_SMD_3215*": 180.0
  "Crystal_SMD_5032*": 180.0

  # --- USB / connector packages ---
  "USB_C_Receptacle*": 0.0
  "USB_Micro-B*": 0.0

# Per-part corrections keyed by LCSC part number.
#
# The entries below were verified against JLCPCB's assembly preview on a
# real order (2026-09-26, all top side).  They are keyed by LCSC number
# rather than changed globally because the KiCad footprint used and the
# EasyEDA model origin are both part-specific.
lcsc_corrections:
  # SN74LVC541APWR, TSSOP-20: preview needed a 90-degree clockwise turn vs
  # native KiCad rotation.  Agrees with the "TSSOP-20*" glob (270); pinned
  # here so this verified part does not depend on the package-wide rule.
  C113281:
    rotation: 270.0

  # AP2112K-3.3TRG1, SOT-23-5: preview needed 90 degrees clockwise (pin 1
  # onto KiCad pad 1).  NOTE: conflicts with the "SOT-23*" glob (180), which
  # is left unchanged for other SOT-23-5 parts.
  C51118:
    rotation: 270.0

  # USBLC6-2SC6, SOT-23-6: 90 degrees clockwise, as for C51118.  Also
  # conflicts with the "SOT-23*" glob (180).
  C7519:
    rotation: 270.0

  # JS102011SAQN slide switch.  The EasyEDA origin lies on the terminal row
  # (y=2989.173 in EasyEDA units) while KiCad's origin is the body centre
  # on the locating-hole line (y=3000): 10.827 * 0.254 mm = 2.75 mm.  In
  # the preview (placed at KiCad rotation 0) the model sat 2.75 mm low;
  # shifting it up on the board (CPL +Y in JLCPCB's Y-up terms) aligned both
  # pegs and all three terminals.  "Up" is -Y in the footprint-local frame.
  C221660:
    rotation: 0.0
    offset_y_mm: -2.75

  # TYPE-C-31-M-12 USB-C receptacle.  EasyEDA origin y=2997.4175 vs shield
  # rows y=2990.702 / 3007.158 (0.254 mm/unit); KiCad shield rows at local
  # y=-3.13 / +1.05.  Measuring from either row puts the EasyEDA origin at
  # local y ~= -1.425 mm (-3.13 + 6.7155*0.254; 1.05 - 9.7405*0.254).  Verified in the preview at KiCad rotation 180, where
  # this local -Y offset moves the part 1.425 mm down on the board (CPL
  # -1.425 mm in JLCPCB's Y-up terms), matching the observed correction.
  C165948:
    rotation: 0.0
    offset_y_mm: -1.425
